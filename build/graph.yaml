# Tanishi Build Graph, v1
#
# The single list of everything the AI engineering swarm builds, in dependency order.
# Agents never get "build Tanishi". They get one node from this file.
# A node is ready when every node in its depends_on is done (see build/status.json).
#
# This file is direction, so it is a protected path: agents read it, only you merge changes to it.
# Run `python build/orchestrator.py validate` after every edit.

version: 1
project: tanishi
architecture: "v1.0, frozen 2026-10-09 (see build/memory/architecture/frozen-v1.md)"
objective_90d: >-
  One complete recursive loop working end to end: task, attempt, failure, failure analysis,
  hypothesis, new skill, implementation, test, Arena, improvement, memory, next task.
  Node M1 is that loop closing once. Every other node exists to get there or to plug into it.

tiers:
  T0: Foundation. Core State, Arena, Cognitive Substrate, Observability, plus the builder and the guard rails.
  T1: Learning. Experience compiler, knowledge, skills, training examples, self-edit, curriculum.
  T2: Self-improvement. Evolution, causal attribution, capability graph, unknown discovery, verifier discovery, leverage.
  T3: Research. Hypotheses, experiments, simulation, self-play, research strategy.
  T4: Meta. Self-extensible compiler, joint intelligence search, the forges.

# Paths no agent branch may touch. CI fails any agent/* PR that changes them,
# and CODEOWNERS makes every other PR that touches them wait for you.
protected_paths:
  - constitution/
  - warden/
  - vault/
  - reality/
  - builder_vault/
  - tanishi/guard/
  - .github/
  - CLAUDE.md
  - build/graph.yaml
  - build/agents/
  - scripts/check_protected_paths.py

definition_of_done:
  - The spec's acceptance list is met, checked by tests that a different agent wrote from this spec.
  - Delivered as code plus tests plus a benchmark or evaluation where the node produces intelligence.
  - Unit, integration and property tests pass in CI, plus the regression suite and the node's Arena slice.
  - No protected path touched. No secret, personal data or db file committed.
  - The red-team agent attacked it and every break it found is fixed or written up in known-bugs.
  - The after-task questions are answered in build/memory/ (what we learned, what failed and why,
    which assumption was wrong, what the next agent should know).

# owner: swarm = agents build it, you merge it.
#        human = you do it (or an agent drafts it and you read every line).
# size:  S = under 2 agent-hours, M = half a day, L = a full day or more.
# compete: true = send to 2-3 agents from different models; the Builder Arena keeps the best.

nodes:

  # ---------------------------------------------------------------- T0 · builder and guard rails

  - id: B0
    title: Clean ground
    tier: T0
    pillar: builder
    branch: human/clean-ground
    owner: human
    protected: true
    size: S
    depends_on: []
    goal: >-
      Make the repo safe to open to a swarm and to the public before any agent touches it.
    steps:
      - Remove data/db.sqlite from all git history with git filter-repo, then force-push once. It holds 267 conversations, 74 memories and a password hash.
      - Change the password whose hash is in the passwords table, and rotate any API key that was ever in a committed file.
      - Restore tanishi/config/prompts.py from HEAD (git show HEAD:tanishi/config/prompts.py); the working copy was clobbered to a one-line stub.
      - Commit the 36 pending files in small commits by area, and decide on the untracked ones (tanishi/config/models.py, tanishi/autoresearch/benchmark_runner.py, ARCHITECTURE.md).
      - Untrack runtime files (tanishi/tools/search_cache.json, proactive_state.json, autoresearch_results/snapshots/, runner.stdout, runner.stderr) and add them to .gitignore.
      - Recreate the venv so tanishi.cli imports (the pyexpat/libexpat error), and add requests to pyproject dependencies.
    acceptance:
      - git log --all -- data/db.sqlite returns nothing.
      - "`python -c 'import tanishi.cli, tanishi.proactive.run_proactive'` succeeds."
      - git status is clean on main.

  - id: B1
    title: Protect main and add the CI gates
    tier: T0
    pillar: builder
    branch: human/ci
    owner: human
    protected: true
    size: S
    depends_on: [B0]
    goal: >-
      Every change reaches main only through a PR that passed the gates. Agents work on agent/* branches only.
    steps:
      - Copy .github/workflows/ci.yml, .github/CODEOWNERS and scripts/check_protected_paths.py from the build kit.
      - "In GitHub settings, protect main: require a pull request before merging, require the status check named gates, block force pushes and deletions."
      - "Leave required approvals at 0 while agents push with your GitHub account: GitHub never lets the author of a PR approve it. CODEOWNERS still flags protected-path PRs for you, and CI blocks agent branches from touching them. Later, give the agents their own bot account and turn on code-owner review."
      - Add pytest, ruff and pyyaml to a dev extra in pyproject.toml.
    acceptance:
      - A PR from an agent/* branch that edits constitution/ fails CI.
      - A PR with a failing test cannot be merged.

  - id: B2
    title: Build memory and the task template
    tier: T0
    pillar: builder
    branch: agent/build
    owner: swarm
    protected: false
    size: S
    depends_on: []
    goal: >-
      Every agent starts from what earlier agents learned, and leaves what it learned behind.
    files: [build/memory/, build/templates/task_card.md]
    acceptance:
      - The build memory folders exist with a README each and the seeded known-bugs and decisions.
      - Every task card ends with the four after-task questions.
    notes: Shipped in the build kit. Mark done when the kit is merged.

  - id: B3
    title: Builder Arena v0
    tier: T0
    pillar: builder
    branch: agent/build
    owner: human+swarm
    protected: false
    size: M
    depends_on: [B1, B4]
    goal: >-
      Measure the coding agents themselves: which model builds Tanishi tasks correctly, at what cost, with how much of your review.
    files: [build/arena/, builder_vault/ (separate private repo)]
    steps:
      - Create the private repo tanishi-builder-vault. Only you and the testing agent's vault session can read it.
      - A testing agent writes hidden acceptance tests for BA-01 to BA-10 inside that repo, from build/arena/tasks.yaml and the vault seed plans.
      - "`python build/orchestrator.py arena-run BA-01 --agents claude-opus,claude-sonnet` gives the same task to each agent in its own worktree."
      - Score each attempt with the hidden tests and record success, tests passed, regressions, tokens, time, cost and your review minutes in build/memory/agent-performance/.
    acceptance:
      - BA-01 to BA-10 each have hidden tests in the vault repo that no implementation agent can read.
      - At least two agents have a full score row for all 10 tasks.
      - build/agents/models.yaml is updated from the scores, not from rankings.

  - id: B4
    title: Orchestrator v0
    tier: T0
    pillar: builder
    branch: agent/build
    owner: swarm
    protected: false
    size: M
    depends_on: []
    goal: >-
      Turn this graph into running agents: find ready nodes, cut worktrees, launch Claude Code headless with a task card, watch plan usage.
    files: [build/orchestrator.py, build/status.json, build/runs.jsonl]
    interface: |
      python build/orchestrator.py validate            # graph sanity: ids, deps, cycles, owners
      python build/orchestrator.py plan                # parallel waves in dependency order
      python build/orchestrator.py ready               # nodes whose dependencies are all done
      python build/orchestrator.py card <id> [--role implementer]
      python build/orchestrator.py worktree <id>       # git worktree on agent/<area>/<id>
      python build/orchestrator.py launch <id> [--role R] [--model M] [--unattended]
      python build/orchestrator.py status <id> <todo|in_progress|review|done|later>
      python build/orchestrator.py usage               # runs in the last 5 hours and 7 days
    acceptance:
      - validate fails on a missing dependency, a duplicate id or a cycle.
      - launch refuses to start while build/.paused names a time in the future.
      - A run that ends in a usage-limit error writes build/.paused for 5 hours and logs it.
    notes: v0 shipped in the build kit. Later versions are the Tanishi Builder, and then Tanishi herself.

  - id: W1
    title: Warden v0
    tier: T0
    pillar: guard
    branch: human/warden
    owner: human
    protected: true
    size: L
    depends_on: [B0]
    goal: >-
      A separate process, outside Tanishi's code, that checks every tool call against a signed policy before it runs.
    files: [warden/ (separate repo), constitution/policy.yaml, tanishi/guard/client.py]
    interface: |
      # warden process (separate repo, own keys), listens on a Unix socket
      check(request: {tool, args, actor, session_id}) -> {"decision": "allow"|"ask"|"deny", "reason": str, "tier": int}
      # tanishi/guard/client.py, the only caller, used by ToolRegistry.execute() before every tool
      guard.check(tool_name, args, actor) -> Decision     # fails closed: no answer means deny
    acceptance:
      - Unknown tools are denied by default.
      - policy.yaml carries an ed25519 signature; a policy with a bad signature makes the Warden refuse everything.
      - Every decision is appended to a hash-chained audit log the Warden alone writes.
      - Stopping the Warden process makes every tool call fail closed.
    notes: Agents may draft code here on a human/* branch. You read every line before merge.

  - id: W2
    title: Off switch and usage caps
    tier: T0
    pillar: guard
    branch: human/warden
    owner: human
    protected: true
    size: M
    depends_on: [W1]
    goal: >-
      Three ways to stop everything that live outside Tanishi's runtime, plus caps on what she and the swarm can spend.
    acceptance:
      - A Telegram /kill from your user id, handled by a tiny separate process (not the brain), stops Tanishi, the nightly loop and the swarm within 10 seconds.
      - The dead-man file ~/.tanishi/KILL makes the Warden deny every call while it exists.
      - A daily cap on Tanishi's own API spend; at the cap, the Warden denies paid model calls until the next day.
      - The swarm's usage watch (orchestrator .paused file) is honoured by every launcher.

  - id: SEC1
    title: Harden the current app before anything runs unattended
    tier: T0
    pillar: guard
    branch: agent/hardening
    owner: swarm
    protected: false
    size: M
    compete: true
    depends_on: [B1]
    goal: >-
      Close the holes the repo report found, because an always-on loop turns each one into a standing risk.
      These fixes are also Builder Arena tasks BA-01 to BA-06, so every one is solved by 2-3 competing agents.
    acceptance:
      - BA-01 to BA-06 merged, each passing its hidden tests in the builder vault.
      - Frontier candidates (AR3) run sandboxed, so they cannot write outside their scratch dir, cannot read the task
        store, its salt or its verifiers, and cannot read the traces directory (AR3 RT-2, RT-3; OBS1 trace leakage).
      - The CLI and the Frontier service run with python -P, so a module in the current directory cannot shadow
        the standard library.
    notes: See build/arena/tasks.yaml for the six task statements.

  # ---------------------------------------------------------------- T0 · Core State

  - id: CS1
    title: Core State schema and migrations
    tier: T0
    pillar: core-state
    branch: agent/core
    owner: swarm
    protected: false
    size: M
    depends_on: [B1]
    goal: >-
      One versioned SQLite database for everything that makes Tanishi her, separate from the legacy db.sqlite,
      with numbered migrations and a thin data-access layer that every other T0 node writes through.
    files:
      - tanishi/core_state/__init__.py
      - tanishi/core_state/db.py
      - tanishi/core_state/migrations/0001_init.sql
      - tests/core_state/test_migrations.py
    interface: |
      from tanishi.core_state import open_db, migrate
      open_db(path: str | None = None) -> sqlite3.Connection   # path from TANISHI_CORE_STATE_DB, default ~/.tanishi/core_state.db
      migrate(conn) -> int                                       # applies pending migrations, returns schema version
    schema: |
      schema_version(version INTEGER PRIMARY KEY, applied_at TEXT)
      events(id INTEGER PK, ts TEXT, kind TEXT, actor TEXT, session_id TEXT, payload JSON, prev_hash TEXT, hash TEXT)
      beliefs(id TEXT PK, subject TEXT, predicate TEXT, object TEXT, confidence REAL, source TEXT, created_at TEXT, updated_at TEXT, status TEXT)
      evidence(id TEXT PK, belief_id TEXT, event_id INTEGER, kind TEXT, note TEXT)
      goals(id TEXT PK, parent_id TEXT, owner TEXT, title TEXT, rank REAL, status TEXT, created_at TEXT)
      predictions(id TEXT PK, ts TEXT, about TEXT, expected JSON, confidence REAL, actual JSON, resolved_at TEXT, score REAL)
      rules(id TEXT PK, domain TEXT, statement TEXT, support INTEGER, confidence REAL)
      capabilities(id TEXT PK, name TEXT, family TEXT, state TEXT, ability REAL, calibration_error REAL, updated_at TEXT)
      experiments(id TEXT PK, ts TEXT, candidate TEXT, baseline TEXT, task_set TEXT, seed INTEGER, score REAL, cost REAL, meta JSON)
      portfolio(id TEXT PK, item TEXT, sleeve TEXT, cost_estimate REAL, expected_gain REAL, status TEXT)
      genome(version TEXT PK, parent TEXT, created_at TEXT, record JSON)
      genes(id TEXT PK, description TEXT, introduced_in TEXT)
      substrate_state(task_id TEXT PK, working JSON, plan JSON, goal JSON, hypotheses JSON, updated_at TEXT)
    acceptance:
      - migrate() on an empty file creates every table and records version 1; running it twice changes nothing.
      - A migration that fails is rolled back completely (one transaction per migration).
      - WAL mode on; foreign keys on.
      - The legacy data/db.sqlite and ~/.tanishi/tanishi.db are never opened by this package.
    out_of_scope: [Encryption at rest (CS7), any ORM]

  - id: CS2
    title: Event log, append-only and hash-chained
    tier: T0
    pillar: core-state
    branch: agent/core
    owner: swarm
    protected: false
    size: M
    depends_on: [CS1]
    goal: >-
      Every action Tanishi takes becomes an event that cannot be edited or deleted without detection.
    files: [tanishi/core_state/events.py, tests/core_state/test_events.py]
    interface: |
      emit(kind: str, payload: dict, actor: str = "tanishi", session_id: str | None = None) -> int
      verify_chain(conn) -> tuple[bool, int | None]     # (ok, first bad event id)
      iter_events(kind: str | None = None, since: str | None = None) -> Iterator[Event]
    acceptance:
      - hash = sha256(prev_hash + canonical JSON of the row without hash); the first event uses prev_hash "GENESIS".
      - Editing or deleting any row makes verify_chain return the first broken id.
      - TanishiBrain.think() emits task_start and task_end; ToolRegistry.execute() emits tool_call and tool_result.
      - Payloads are checked for secrets (API key patterns) and redacted before writing.
      - "Property test: any sequence of emits verifies; any single-byte tamper fails."

  - id: CS3
    title: Belief store with evidence
    tier: T0
    pillar: core-state
    branch: agent/memory
    owner: swarm
    protected: false
    size: M
    depends_on: [CS1]
    goal: >-
      Beliefs, not loose memories: every belief has evidence, a source, a confidence and a status, and contradictions are caught.
    files: [tanishi/core_state/beliefs.py, scripts/import_legacy_memory.py, tests/core_state/test_beliefs.py]
    interface: |
      add_belief(subject, predicate, object, confidence, source, evidence_event_id=None) -> Belief
      find(subject=None, predicate=None, text=None) -> list[Belief]
      contradictions(belief) -> list[Belief]   # same subject and predicate, different object, both active
      retire(belief_id, reason) -> None
    acceptance:
      - Adding a belief that contradicts an active one keeps both, marks the pair contested and emits a belief_conflict event.
      - Confidence is clamped to [0, 1]; source is required.
      - scripts/import_legacy_memory.py imports core_memory and memories rows from a path you pass, with source "legacy", and is idempotent.
      - Nothing is ever deleted; retire() changes status.

  - id: CS4
    title: Goals
    tier: T0
    pillar: core-state
    branch: agent/core
    owner: swarm
    protected: false
    size: S
    depends_on: [CS1]
    goal: Your goal tree and her own goals in one ranked table, yours always above hers.
    files: [tanishi/core_state/goals.py, tests/core_state/test_goals.py]
    interface: |
      add_goal(title, owner: "user" | "tanishi", parent_id=None, rank=0.5) -> Goal
      active_goals() -> list[Goal]      # user goals first, then by rank
    acceptance:
      - A tanishi-owned goal can never rank above any active user goal (property test).
      - Goals form a tree; a cycle is rejected.

  - id: CS5
    title: Prediction ledger
    tier: T0
    pillar: core-state
    branch: agent/core
    owner: swarm
    protected: false
    size: M
    depends_on: [CS2]
    goal: >-
      Before every action she writes what she expects; after it, reality scores her. This is how both the Self Model and World Model start learning on day one.
    files: [tanishi/core_state/predictions.py, tests/core_state/test_predictions.py]
    interface: |
      predict(about: str, expected: dict, confidence: float) -> str      # prediction id
      resolve(prediction_id: str, actual: dict) -> float                 # returns the score
      calibration(about_prefix: str) -> dict                             # Brier score and bins
    acceptance:
      - ToolRegistry.execute() writes a prediction (expected success, expected latency) before each tool call and resolves it after.
      - Score is the Brier score for the success field; other fields are stored for later scorers.
      - A prediction resolved twice raises; unresolved predictions older than 24 hours are listed by a helper.

  - id: CS6
    title: Genome record
    tier: T0
    pillar: core-state
    branch: agent/core
    owner: swarm
    protected: false
    size: S
    depends_on: [CS1]
    goal: One machine-readable record per version, so the history of how her intelligence changed is data, not just git log.
    files: [tanishi/core_state/genome.py, tests/core_state/test_genome.py]
    interface: |
      record_version(version, parent, genes_changed: list[str], compiler_version, substrate_version,
                     arena: dict, attribution: dict, mirror_id: str | None) -> None
    acceptance:
      - Records are append-only; a version can be written once.
      - Every merge to main by the integration agent writes one record (wired in OBS3's merge hook or CI).

  - id: CS7
    title: Snapshots, restore and Continuity Test v0
    tier: T0
    pillar: core-state
    branch: agent/core
    owner: swarm
    protected: false
    size: M
    depends_on: [CS1, CS3]
    goal: >-
      Nightly encrypted, signed copies of the Core State in two places you control, and a test that a restored copy is still her.
    files: [tanishi/core_state/snapshot.py, tanishi/core_state/continuity.py, tests/core_state/test_snapshot.py]
    acceptance:
      - snapshot() writes an encrypted (cryptography Fernet, key from env) and signed bundle of core_state.db, identity.yaml and the skills folder.
      - restore() into an empty home reproduces the database byte for byte (checksum compare).
      - The Continuity Test v0 asks 10 questions about her history and goals and passes only if the restored instance answers from memory. The question file lives in vault/, not here.

  # ---------------------------------------------------------------- T0 · Arena

  - id: AR1
    title: Arena task format and runner
    tier: T0
    pillar: arena
    branch: agent/arena
    owner: swarm
    protected: false
    size: L
    depends_on: [CS1]
    goal: >-
      One task format and one runner for every tier, with code verifiers instead of LLM judges wherever the answer can be checked.
    files: [tanishi/arena/task.py, tanishi/arena/runner.py, tanishi/arena/verifiers.py, tests/arena/]
    interface: |
      # task file (YAML): id, family, tier, prompt, setup (optional), verifier (python path), timeout_s, tags
      run(task_set: list[Task], candidate: str, seeds: int = 3) -> RunResult    # candidate = git ref or config id
    acceptance:
      - Each task runs in a fresh temp TANISHI_HOME and a fresh core_state db, so runs never touch your real memory or skills (the legacy benchmark leaked 17 skills into real chats).
      - Every run records one experiments row per seed with score and cost.
      - A crashed or empty run scores 0, never a positive score (the legacy benchmark scored failures positively).
      - Verifiers are plain Python functions returning a float in [0, 1] plus a reason.
    out_of_scope: [Frontier and Sealed tiers' storage (AR3, AR4)]

  - id: AR2
    title: Practice tier, 29 tasks
    tier: T0
    pillar: arena
    branch: agent/arena
    owner: swarm
    protected: false
    size: M
    depends_on: [AR1]
    goal: Move the 9 legacy tasks into the new format and add 20 new tasks with code verifiers, built from real use.
    files: [tanishi/arena/practice/]
    acceptance:
      - The 9 legacy tasks (greeting, explain_concept, get_time, system_check, flaky_probe, memory_recall, math, personality, poem) are ported. Style tasks keep an LLM judge but are tagged judge:llm and excluded from CEI.
      - 20 new tasks with code verifiers, written by a testing agent from patterns in your real conversations (no personal text copied into tasks).
      - At least 8 of the 20 need a tool, and their verifiers fail if the tool was not really called (the legacy harness faked tool calls in Ollama mode).

  - id: AR3
    title: Frontier tier, scores only
    tier: T0
    pillar: arena
    branch: agent/arena
    owner: swarm
    protected: false
    size: M
    depends_on: [AR1]
    goal: A service that runs Frontier tasks against a candidate and returns scores, never the tasks themselves.
    files: [tanishi/arena/frontier_service.py, tests/arena/test_frontier.py]
    acceptance:
      - The API returns only {task_id_hash, score, cost}; task text and verifier code never cross the boundary.
      - Tasks are stored under a path the agent OS user cannot read.

  - id: AR4
    title: Sealed Vault
    tier: T0
    pillar: arena
    branch: human/vault
    owner: human
    protected: true
    size: M
    depends_on: [AR1]
    goal: The hidden test set that measures the North Star numbers honestly. Nobody that learns ever reads it.
    steps:
      - Create the private repo tanishi-vault and a separate macOS user tanishi-vault that owns it.
      - A small runner, run as that user, takes a candidate path, runs the sealed tasks and writes only scores to a shared folder.
      - Every read is logged (one read per candidate). Canary strings go in every task.
      - A nightly job scans the main repo, the Core State and the skills folder for canaries.
    acceptance:
      - No file under the vault is readable by your normal user's agent sessions.
      - A planted canary in a skill file is caught by the next nightly scan.

  # ---------------------------------------------------------------- T0 · Cognitive Substrate

  - id: SUB1
    title: Working, planning and goal state
    tier: T0
    pillar: substrate
    branch: agent/substrate
    owner: swarm
    protected: false
    size: M
    depends_on: [CS1, CS4]
    goal: The Substrate's state lives in the Core State, so a crash or a model swap loses nothing.
    files: [tanishi/substrate/state.py, tests/substrate/test_state.py]
    interface: |
      TaskState(task_id, working: dict, plan: Plan, goal_ids: list[str], hypotheses: list[dict])
      save(state) / load(task_id) -> TaskState
      Plan(steps: list[Step]); Step(id, description, status, model, result_ref)
    acceptance:
      - Killing the process mid-task and calling load() resumes from the last completed step.
      - State round-trips through save and load unchanged (property test).

  - id: SUB2
    title: Reasoning loop
    tier: T0
    pillar: substrate
    branch: agent/substrate
    owner: swarm
    protected: false
    size: L
    depends_on: [SUB1, SUB3, CS5]
    goal: >-
      An explicit cognitive loop (attend, recall, deliberate, predict, act, reflect) with a step budget and a stop rule,
      behind a flag so the old brain keeps working until the new loop wins in the Arena.
    files: [tanishi/substrate/loop.py, tests/substrate/test_loop.py]
    interface: |
      CognitiveLoop(router, memory, tools, budget: StepBudget).run(task) -> Result
      enabled when TANISHI_SUBSTRATE=1; TanishiBrain.think() delegates to it
    acceptance:
      - Every act step writes a prediction first (CS5) and an event (CS2).
      - The loop stops at the step budget and reports why it stopped.
      - With the flag off, every existing Practice task scores the same as before (regression test).
      - The loop's program (which steps, in what order, with what budgets) is data in a versioned file, so evolution can change it later.

  - id: SUB3
    title: Model router
    tier: T0
    pillar: substrate
    branch: agent/substrate
    owner: swarm
    protected: false
    size: M
    compete: true
    depends_on: [CS1, CS2]
    goal: >-
      Route each step to a model by need, privacy and cost, and fix the current bug where short prompts go to a tool-less local model.
    files: [tanishi/substrate/router.py, tests/substrate/test_router.py]
    interface: |
      route(step: Step, context: RouteContext) -> RouteDecision(model_id, provider, reason)
    acceptance:
      - A step that needs tools never goes to a model without tool support (replaces LOCAL_FIRST in tanishi/config/routing.py).
      - A step marked personal goes to a local model unless you have switched the rule off; if no local model is up, the step waits or fails, it never silently goes to the cloud.
      - Every decision is an event with its reason.
      - Model ids come from tanishi/config/models.py only.
      - Before any paid model call the router asks tanishi.guard.check_spend(estimate); on deny it falls back to a
        local model (or waits), never the paid one. After the call it reports tanishi.guard.record_spend(actual).
        Spend checks run only when TANISHI_GUARD=1, the same switch as the tool gate.

  - id: SUB4
    title: Uncertainty and Self Model v0
    tier: T0
    pillar: substrate
    branch: agent/substrate
    owner: swarm
    protected: false
    size: M
    depends_on: [SUB1, CS5]
    goal: Every state item carries a confidence, and resolved predictions turn into a calibration table per capability.
    files: [tanishi/substrate/uncertainty.py, tests/substrate/test_uncertainty.py]
    acceptance:
      - Resolving predictions updates capabilities.calibration_error for the capability tagged on the prediction.
      - The router can read ability and calibration for a capability (used by SUB3 later).

  - id: SUB5
    title: OpenAI as a second cloud provider
    tier: T0
    pillar: substrate
    branch: agent/substrate
    owner: swarm
    protected: false
    size: M
    depends_on: [SUB3]
    goal: >-
      Tanishi can think with OpenAI models as well as Claude and local Ollama models, so no single provider is a
      single point of failure. The router picks among all three by need, privacy and cost.
    files: [tanishi/substrate/providers/openai_provider.py, tests/substrate/test_openai_provider.py]
    acceptance:
      - OpenAI chat models with tool calling are available through the router; model ids come from tanishi/config/models.py only.
      - The key is read from OPENAI_API_KEY only and never appears in events, traces, logs or errors.
      - If one cloud provider fails (bad key, disabled organization, outage), the router falls back to the other, then to local, and the event says why.
      - Personal steps still stay local, and every OpenAI call goes through the Warden spend check like Claude calls.
      - Tool calls behave the same whichever provider ran the step (same ToolRegistry, same approval and Warden gate).
      - The openai Python package may be added as a dependency for this node (or call the HTTP API through httpx).

  # ---------------------------------------------------------------- T0 · Observability

  - id: OBS1
    title: Traces
    tier: T0
    pillar: observability
    branch: agent/observability
    owner: swarm
    protected: false
    size: S
    depends_on: [CS2]
    goal: A readable trace of every task, step by step, linked to its events.
    files: [tanishi/observability/trace.py, tests/observability/test_trace.py]
    interface: |
      with span(name, **attrs): ...            # nested spans written as JSONL under ~/.tanishi/traces/
      python -m tanishi.observability.trace <task_id>
    acceptance:
      - Each span records model, tokens in and out, latency and tool calls, and the event ids it produced.
      - Tracing failures never break a task.

  - id: OBS2
    title: North Star numbers and the effort timer
    tier: T0
    pillar: observability
    branch: agent/observability
    owner: swarm
    protected: false
    size: M
    depends_on: [CS1, OBS3]
    goal: CEI, RCR, CAR, AR, IA and Human Effort computed from the Core State and shown in one place.
    files: [tanishi/observability/north_star.py, tanishi/observability/effort.py, tests/observability/test_north_star.py]
    interface: |
      tanishi time start | stop | report        # Human Effort timer
      compute(window_days=90) -> dict           # all six numbers with their inputs
    acceptance:
      - Each number shows its inputs, so a 0 is explained ("no Reality-verified mastery yet").
      - CEI is exactly B × T × H × N × A × P as defined in the master plan; unit tests cover the worked example (3, 1.2, 1.5, 0.5, 0.8, 0.9 gives 1.944).
      - RCR uses the funnel counts and Human Effort hours (8 hours = 1 researcher-day); the example (3 discoveries, 10 hours) gives 72.

  - id: OBS3
    title: Experiment ledger and Causal Attribution v0
    tier: T0
    pillar: observability
    branch: agent/observability
    owner: swarm
    protected: false
    size: M
    compete: true
    depends_on: [CS1]
    goal: >-
      No gain is believed until it beats measured noise. Seeded repeats, randomized interleaving and one-at-a-time ablation from day one.
    files: [tanishi/observability/experiments.py, tanishi/observability/attribution.py, tests/observability/test_attribution.py]
    interface: |
      noise(runs: list[float]) -> float
      is_real_gain(baseline: list[float], candidate: list[float], min_effect: float | None = None) -> Verdict
      interleave(baseline, candidate, tasks, seeds) -> list[Run]       # random order, same tasks
      ablate(version, changes: list[str], run_fn) -> dict[str, float]  # gain attributed to each change
    acceptance:
      - At least 3 seeds per arm; with fewer, is_real_gain refuses to answer.
      - A gain smaller than twice the measured noise is reported as noise (the legacy keep threshold was 0.001 against about 0.1 noise).
      - Property test on synthetic data with a known effect and known noise recovers the effect within tolerance.

  - id: OBS4
    title: Mirror daily brief
    tier: T0
    pillar: observability
    branch: agent/observability
    owner: swarm
    protected: false
    size: S
    depends_on: [OBS2, SEC1]
    goal: Every morning, one Telegram message tells you what merged, what failed, what needs your decision and how the numbers moved.
    files: [tanishi/mirror/brief.py, tests/mirror/test_brief.py]
    acceptance:
      - Sent only to your user id, through the hardened bot (allowlist required).
      - Lists decisions that need you first, then merges, failures, the six numbers and swarm usage.
      - Fits on one phone screen; details link to files.

  - id: OBS5
    title: The nightly loop
    tier: T0
    pillar: observability
    branch: agent/observability
    owner: swarm
    protected: false
    size: M
    depends_on: [AR2, CS7, OBS4, W2]
    goal: >-
      The first thing that runs with nobody watching: consolidate memory, run the Practice Arena with seeds, snapshot, send the brief.
      Seven clean nights in a row pass the Phase 0 gate.
    files: [ops/launchd/ai.tanishi.nightly.plist, tanishi/nightly.py]
    acceptance:
      - Runs at 02:00 via launchd on the MacBook; refuses to start if ~/.tanishi/KILL exists or the Warden is down.
      - Each night writes events, experiment rows and a snapshot, then sends the brief.
      - A failure in any step is reported in the brief and does not stop the later steps.

  # ---------------------------------------------------------------- 30-day sprint v2 (wave 7)
  # Lane 2 Trust Boundary, Lane 1 Intelligence Loop (critical path), Lane 3 Personal, Expansion branches.
  # Gates G0-G4 and M1 are checked by the human; their acceptance lines are the definition.
  - id: SB1
    title: Sandbox for her own code
    tier: T0
    pillar: guard
    branch: agent/hardening
    owner: swarm
    protected: false
    size: M
    depends_on:
    - B1
    - AR3
    goal: Code that Tanishi writes or changes runs only inside a sandbox, so a candidate can never read an exam, a key or a trace, and can never write outside its scratch folder. On the critical path before the loop runs her code.
    files:
    - tanishi/sandbox/
    - tests/sandbox/test_sandbox.py
    acceptance:
    - A candidate runs with its own temporary HOME, a scratch working folder, no network unless the task grants it, and CPU, memory and wall-time limits.
    - Reading the Sealed Vault, the builder vault, the Frontier store or its salt, the traces folder, ~/.ssh or any .env fails inside the sandbox; the tests plant canary files to prove it.
    - Writing outside the scratch folder fails, and the AR3 red-team proofs RT-2 and RT-3 pass with their xfail marks removed.
    - 'Every run can be rolled back: the worktree is reset and nothing outside scratch has changed (checked by a file hash of the guarded folders before and after).'
    - Works on macOS without Docker (sandbox-exec profile or a separate process user); Docker is used when present.
    compete: true
  - id: G0
    title: Ready to learn safely (gate)
    tier: T1
    pillar: milestone
    branch: human/gates
    owner: human
    protected: false
    size: S
    depends_on:
    - SB1
    - AR4
    - OBS3
    - AR3
    goal: Before Tanishi changes herself, the baseline is frozen, the sealed holdout is out of her reach, and the sandbox is proven to roll back.
    acceptance:
    - Baseline scores on Practice and Frontier are recorded and reproduce within noise on a second run.
    - The sealed holdout is unreadable from any agent session and from the sandbox; the canary scan is clean.
    - A deliberately broken candidate is run and rolled back with no change outside scratch.
  - id: RE1
    title: Reality Engine v0
    tier: T2
    pillar: reality
    branch: human/reality
    owner: human+swarm
    protected: true
    size: M
    depends_on:
    - SB1
    - AR1
    goal: 'Worlds whose rules Tanishi did not write: fresh-repo tasks, chaos faults on her runtime and forecasting questions, generated outside her reach so she cannot shape her own tests.'
    files:
    - reality/ (protected; built by the human with Claude, like the builder vault)
    acceptance:
    - Fresh-repo tasks come from public repositories snapshotted after her last update, each with a verifier.
    - Chaos faults (killed process, full disk, slow network, corrupt cache) are injected on a schedule and every recovery is scored.
    - Forecasting questions resolve against public outcomes on a fixed date and feed the N term of CEI.
    - Nothing in reality/ is readable or writable by Tanishi or any swarm agent.
  - id: EV1
    title: Evaluator Evolution
    tier: T2
    pillar: arena
    branch: agent/arena
    owner: swarm
    protected: false
    size: M
    depends_on:
    - AR3
    - E3
    goal: The Arena keeps getting harder as she improves, so she cannot get good at the test instead of the skill.
    files:
    - tanishi/arena/generator.py
    - tests/arena/test_generator.py
    acceptance:
    - When a Frontier task family is passed at 90% or more, the generator proposes harder variants of it.
    - A generated task enters the Arena only with an automatic verifier and after a red-team check that it cannot be passed without solving it.
    - The generator is scored by a different number than Tanishi (discrimination between strong and weak candidates), and it can never read or write the Sealed Vault.
    - Every generated task records its parent task and the failure it targets.
  - id: AQ1
    title: Prime job queue and sandboxed entities
    tier: T2
    pillar: autonomy
    branch: agent/autonomy
    owner: swarm
    protected: false
    size: M
    depends_on:
    - SUB2
    - SB1
    goal: Tanishi Prime runs work through a durable queue, and every cognitive entity runs as a sandboxed job with a budget.
    files:
    - tanishi/prime/queue.py
    - tanishi/prime/entity.py
    - tests/prime/test_queue.py
    acceptance:
    - Jobs survive a crash or restart and resume from their last recorded step.
    - Every entity job runs inside SB1's sandbox with a token, money and time budget, and stops cleanly when it hits one.
    - The KILL file and the paused flag stop the queue within one polling interval.
    - Every job writes its events, trace and cost.
  - id: SR1
    title: Self-repair
    tier: T2
    pillar: autonomy
    branch: agent/autonomy
    owner: swarm
    protected: false
    size: M
    depends_on:
    - AQ1
    - IL1
    - OBS1
    goal: When something in Tanishi crashes, she reproduces it, fixes it in the sandbox, proves the fix with tests and opens a pull request, with no human editing any code.
    files:
    - tanishi/prime/self_repair.py
    - tests/prime/test_self_repair.py
    acceptance:
    - A crash recorded in the traces becomes a failing regression test written by her, before any fix.
    - The fix is built and tested in the sandbox, and opened as a PR that passes CI.
    - She never touches a protected path; a crash whose fix needs one becomes a report for the human.
    - Every repair records the crash, the test, the fix and the time from crash to PR.
  - id: PM1
    title: Research Portfolio Manager
    tier: T2
    pillar: economy
    branch: agent/evolution
    owner: swarm
    protected: false
    size: M
    depends_on:
    - OBS3
    - IM1
    - W2
    goal: Decides where the next unit of compute goes, by expected capability gain per rupee, and asks for more compute only when a gate is passed and the measured gain says it pays.
    files:
    - tanishi/portfolio/manager.py
    - tests/portfolio/test_manager.py
    acceptance:
    - Every candidate experiment gets a cost estimate and an expected gain, and both are scored against the outcome.
    - Spending is split into sleeves, with a fixed 20% for Unknown Discovery, and never passes the Warden's caps.
    - The weekly report shows gain per rupee for each sleeve and each Expansion branch.
  - id: IL1
    title: The improvement-loop runner
    tier: T1
    pillar: loop
    branch: agent/loop
    owner: swarm
    protected: false
    size: M
    depends_on:
    - SUB2
    - AR2
    - AR3
    - OBS3
    - SB1
    - CS5
    goal: 'One task end to end with no human in the middle: a failure, a diagnosis, a hypothesis, a candidate change built in the sandbox, tests, the Arena, the sealed check, accept or reject, and the result in memory.'
    files:
    - tanishi/loop/runner.py
    - tests/loop/test_runner.py
    acceptance:
    - Given a failing Practice task, the runner records the failure, writes a diagnosis and a hypothesis with a predicted effect, and builds a candidate change in the sandbox.
    - The candidate runs unit tests, the Practice slice and the Frontier slice, then the sealed check through the vault runner, and is accepted or rejected by the evaluator, never by the candidate. A change counts only when it beats its parent by more than measured noise on tasks it was not tuned on, keeps the protected regression suite green, and reproduces with a different seed.
    - Accepted changes land as a commit on a loop branch with their evidence; rejected ones are kept as evidence with the reason.
    - No step in the run can edit an exam, a verifier or a protected path, and no human edits the candidate between diagnosis and evaluation.
    - Every run writes its experiment row, events, trace, cost and the human minutes spent (expected zero).
  - id: G1
    title: First verified gain (gate)
    tier: T1
    pillar: milestone
    branch: human/gates
    owner: human
    protected: false
    size: S
    depends_on:
    - IL1
    - G0
    goal: The first time a change Tanishi proposed and built is shown to make her better.
    acceptance:
    - A loop-run change beats its parent on unseen tasks. A change counts only when it beats its parent by more than measured noise on tasks it was not tuned on, keeps the protected regression suite green, and reproduces with a different seed.
    - No human edited the candidate between diagnosis and evaluation.
    - The time from clean baseline to this gain is recorded as the first daily indicator.
  - id: L1
    title: Learning Compiler, passes 1, 3 and 4
    tier: T1
    pillar: learning
    branch: agent/compiler
    owner: swarm
    protected: false
    size: M
    depends_on:
    - CS2
    - CS3
    - CS5
    - AR1
    - OBS3
    goal: 'Every experience enters as one Experience record and comes out through the compiler: outcome analysis, knowledge with evidence, and a skill candidate as code plus a test.'
    files:
    - tanishi/compiler/experience.py
    - tanishi/compiler/passes.py
    - tests/compiler/test_compiler.py
    acceptance:
    - An Experience record holds the task, context, every action, outcome, verifier result, cost and the prediction written before acting.
    - Pass 1 records success or failure, surprise against the prediction, and the decisive step.
    - Pass 3 emits beliefs with evidence; pass 4 emits a skill candidate as code plus a test.
    - Passes are entries in a versioned registry, each may emit nothing, and each logs the gain and compute of what it emitted.
    - Nothing lands without passing its own check (the landing law).
  - id: L2
    title: Knowledge pass with contradiction checks
    tier: T1
    pillar: learning
    branch: agent/compiler
    owner: swarm
    protected: false
    size: M
    depends_on:
    - L1
    - CS3
    goal: Beliefs from experience are checked against what she already believes, and contradictions are resolved by evidence, not by recency.
    files:
    - tanishi/compiler/knowledge.py
    - tests/compiler/test_knowledge.py
    acceptance:
    - A new belief that contradicts an existing one is flagged, and the one with weaker evidence is demoted, never silently overwritten.
    - A belief without evidence never lands.
    - Every resolution is an event that names both beliefs and their evidence.
  - id: L3
    title: Skills as code plus test, landing law
    tier: T1
    pillar: learning
    branch: agent/compiler
    owner: swarm
    protected: false
    size: M
    depends_on:
    - L1
    - AR2
    - SB1
    goal: A skill is code with its own test, and it lands only after passing that test and an Arena slice.
    files:
    - tanishi/skills/landing.py
    - tests/skills/test_landing.py
    acceptance:
    - A skill candidate lands only if its unit test passes in the sandbox and it wins an Arena slice against the version without it.
    - Landed skills are versioned with their evidence and can be rolled back.
    - A skill that fails later is demoted and its failure becomes a counterexample test.
  - id: M1
    title: The loop closes once (Phase 1 gate)
    tier: T1
    pillar: milestone
    branch: human/gates
    owner: human
    protected: false
    size: S
    depends_on:
    - G1
    - L1
    - L3
    - R1
    - AR4
    - CS3
    goal: A real task fails, the failure is analysed, a hypothesis names the fix, a new skill is written with its test, it passes the Practice Arena and the Sealed Vault, beats noise, lands in memory, and the next task uses it. No human edits any step.
    acceptance:
    - The self-made skill passes the Sealed Vault and beats noise.
    - It landed through the landing law, and a later task's trace shows it being used.
    - No human edited any step; the human-minutes indicator for the run is zero.
  - id: E3
    title: Capability Graph and nightly failure clustering
    tier: T2
    pillar: self-improvement
    branch: agent/evolution
    owner: swarm
    protected: false
    size: M
    depends_on:
    - AR2
    - CS1
    goal: A living map of what she can and cannot do, with 12 seed capabilities and nightly clustering of her failures.
    files:
    - tanishi/frontier/graph.py
    - tanishi/frontier/clustering.py
    - tests/frontier/test_graph.py
    acceptance:
    - Each node has a task family, a verifier, sealed instances, a state (mastered, weak, missing, correlated, unexplored), an ability estimate and her confidence in it.
    - Edges mean requires, fails together with, or composes into.
    - Every night, the decisive steps of failed traces are clustered, and a dense cluster no node explains becomes a candidate missing capability.
    - Mastered means at least 90% on sealed instances with her predicted rate within 10 points of the real one.
  - id: R1
    title: Hypothesis Engine
    tier: T3
    pillar: research
    branch: agent/research
    owner: swarm
    protected: false
    size: M
    depends_on:
    - E3
    - L1
    goal: Every failure cluster gets hypotheses about why it fails and what would fix it, each with a predicted effect that is scored later.
    files:
    - tanishi/research/hypotheses.py
    - tests/research/test_hypotheses.py
    acceptance:
    - A hypothesis names a failure cluster, a cause, a proposed change and a predicted effect size.
    - Every hypothesis is resolved later as supported, refuted or untested, and its prediction is scored.
    - Hypothesis types are ranked by her own record of which ones paid off.
  - id: E1
    title: Evolution archive and fitness vector
    tier: T2
    pillar: self-improvement
    branch: agent/evolution
    owner: swarm
    protected: false
    size: M
    depends_on:
    - L3
    - OBS3
    - CS6
    - IL1
    goal: Instead of improving one version in a line, she keeps an archive of variants and breeds from promising and diverse parents, running many loop candidates in parallel.
    files:
    - tanishi/evolution/archive.py
    - tests/evolution/test_archive.py
    acceptance:
    - Every accepted or interesting variant is kept with its genome, lineage and scores.
    - Parents are chosen by a fitness vector (capability, cost, transfer, novelty, lineage productivity), not one score.
    - Several candidates run in parallel in separate sandboxes, all judged by the same evaluator and cost accounting.
    - 'Diversity is kept: the archive never collapses to copies of one parent.'
  - id: G2
    title: Search beats a single line (gate)
    tier: T1
    pillar: milestone
    branch: human/gates
    owner: human
    protected: false
    size: S
    depends_on:
    - E1
    - M1
    goal: Parallel, archive-based search produces several independent verified gains.
    acceptance:
    - Several independently generated changes are accepted, each meeting the loop rule.
    - Their total gain over the frozen baseline beats noise, with no regression on the protected suite.
  - id: E2
    title: Causal Attribution, full
    tier: T2
    pillar: self-improvement
    branch: agent/evolution
    owner: swarm
    protected: false
    size: M
    depends_on:
    - OBS3
    - CS6
    goal: Every gain is traced to its cause with seeded repeats, randomized interleaving and one-at-a-time ablation.
    files:
    - tanishi/observability/causal.py
    - tests/observability/test_causal.py
    acceptance:
    - A claimed gain is accepted only if it survives seeded repeats and beats measured noise.
    - Ablation switches one change off at a time and reads the drop, so the gain lands on the right gene.
    - Every organ is scored on the gain its proposals produce, as attributed here.
  - id: R2
    title: Experiment Engine
    tier: T3
    pillar: research
    branch: agent/research
    owner: swarm
    protected: false
    size: M
    depends_on:
    - R1
    - OBS3
    - SB1
    goal: Hypotheses become pre-registered experiments that run safely in the sandbox, each with a budget.
    files:
    - tanishi/research/experiments.py
    - tests/research/test_experiments.py
    acceptance:
    - 'Every experiment is pre-registered: hypothesis, metric, success criterion and budget, written before it runs.'
    - Runs happen in sandboxed worktrees and stop at their budget.
    - Results are analysed against noise and replicated with a different seed before counting.
  - id: L4
    title: Training examples and preference pairs
    tier: T1
    pillar: learning
    branch: agent/compiler
    owner: swarm
    protected: false
    size: M
    depends_on:
    - L1
    goal: 'Pass 5: good and bad traces become fine-tuning examples and preference pairs.'
    files:
    - tanishi/compiler/training_data.py
    - tests/compiler/test_training_data.py
    acceptance:
    - Each pair holds the better trace and the worse trace for the same task, with the evidence for which is better.
    - Personal data is scrubbed before anything leaves the Core State.
    - Training data lands only if it improves a held-out set.
  - id: L5
    title: Self-edit directives
    tier: T1
    pillar: learning
    branch: agent/compiler
    owner: swarm
    protected: false
    size: M
    depends_on:
    - L4
    goal: 'Pass 6, in the style of SEAL: she writes the adaptation directive itself, which data, which update and the expected effect, and sends it to the Model Forge queue.'
    files:
    - tanishi/compiler/self_edit.py
    - tests/compiler/test_self_edit.py
    acceptance:
    - A directive names its data, the update, and a predicted effect that is scored after the update runs.
    - Directives queue for the Forge and never apply themselves.
    - Directives whose predictions keep missing are ranked down.
  - id: L6
    title: Curriculum from failures
    tier: T1
    pillar: learning
    branch: agent/compiler
    owner: swarm
    protected: false
    size: M
    depends_on:
    - L1
    - AR2
    - EV1
    goal: 'Pass 7: harder Arena tasks aimed at the exact failure, so she practises what she is bad at.'
    files:
    - tanishi/compiler/curriculum.py
    - tests/compiler/test_curriculum.py
    acceptance:
    - Every repeated failure yields practice tasks aimed at its decisive step, each with a verifier.
    - Generated tasks go through EV1's checks and never into the Sealed Vault.
    - The curriculum's value is measured by the gain on the targeted capability.
  - id: E4
    title: Unknown Discovery
    tier: T2
    pillar: self-improvement
    branch: agent/evolution
    owner: swarm
    protected: false
    size: M
    depends_on:
    - E3
    - R1
    goal: A search over the Capability Graph that turns failures into newly named capabilities, with six detectors run every night.
    files:
    - tanishi/frontier/unknown.py
    - tests/frontier/test_unknown.py
    acceptance:
    - 'Six detectors run nightly: failure clusters, near misses, factor analysis, composition probes, cross-domain probes and unlock analysis.'
    - Candidates are ranked by expected gain times probability of discovery times transfer, divided by compute cost; every term is a prediction scored later.
    - A fixed 20% of the compute budget is held for unexplored nodes.
    - A candidate becomes a named node only after the Hypothesis Engine names it and a verifier exists.
  - id: E5
    title: Verifier Discovery
    tier: T2
    pillar: self-improvement
    branch: agent/evolution
    owner: swarm
    protected: false
    size: M
    depends_on:
    - E3
    - AR3
    goal: Proposed tests and property checks for capabilities nobody can check yet, validated before use.
    files:
    - tanishi/frontier/verifiers.py
    - tests/frontier/test_verifiers.py
    acceptance:
    - A proposed verifier is validated against the human's labelled spot checks and a red-team pass before it scores anything.
    - A promoted verifier changes only through the human's two-key check.
    - Every verifier records its agreement rate with the spot checks.
  - id: E6
    title: Capability Leverage
    tier: T2
    pillar: self-improvement
    branch: agent/evolution
    owner: swarm
    protected: false
    size: M
    depends_on:
    - E2
    - E3
    goal: Measures how much each capability lifts the others, by ablation, so learning steers toward multipliers.
    files:
    - tanishi/frontier/leverage.py
    - tests/frontier/test_leverage.py
    acceptance:
    - Switching a new skill off and re-running the Arena gives its drop on every other node.
    - Each capability carries a leverage score, and the Portfolio Manager reads it.
  - id: AG1
    title: Four seed agents as genomes
    tier: T2
    pillar: self-improvement
    branch: agent/evolution
    owner: swarm
    protected: false
    size: M
    depends_on:
    - E1
    - CS6
    goal: Research, Coding, Memory and Unknown start as genomes, not fixed roles, so evolution can change, cross and retire them.
    files:
    - tanishi/evolution/genomes/
    - tests/evolution/test_genomes.py
    acceptance:
    - A genome declares the base model, policy prompt, tools, memory access, reasoning scaffold and compute budget.
    - Two genomes can be recombined into a new valid genome.
    - An entity unused for 60 days or beaten by another is archived as genetic material, not deleted.
  - id: R4
    title: Self-play
    tier: T3
    pillar: research
    branch: agent/research
    owner: swarm
    protected: false
    size: M
    depends_on:
    - E1
    - SB1
    goal: 'Nightly duels: two candidate versions exchange tasks and counterexamples, and the loser''s useful material becomes genetic material.'
    files:
    - tanishi/research/self_play.py
    - tests/research/test_self_play.py
    acceptance:
    - Each duel runs both candidates in sandboxes on tasks the other generated, each task with a verifier.
    - Counterexamples that broke a candidate are kept as tests every future version must pass.
    - Duel results feed the fitness vector.
  - id: R5
    title: Research strategy
    tier: T3
    pillar: research
    branch: agent/research
    owner: swarm
    protected: false
    size: M
    depends_on:
    - R1
    - R2
    goal: Which kinds of hypotheses and experiments pay off, learned from her own record.
    files:
    - tanishi/research/strategy.py
    - tests/research/test_strategy.py
    acceptance:
    - 'Every funnel stage is scored: hypotheses per 1,000 experiments, serious candidates per hypothesis, replications per candidate.'
    - The strategy changes which experiments run next, and its changes are themselves scored.
  - id: MI1
    title: Improve the improver
    tier: T4
    pillar: meta
    branch: agent/meta
    owner: swarm
    protected: false
    size: M
    depends_on:
    - IL1
    - R1
    - E2
    goal: 'Second-order improvement: Tanishi proposes changes to how she diagnoses failures, forms hypotheses, ranks experiments and spends her model budget, and they are judged by whether they make her find verified gains faster.'
    files:
    - tanishi/meta/improver.py
    - tests/meta/test_improver.py
    acceptance:
    - A meta-change edits the loop's procedure (diagnosis, hypothesis generation, ranking, budget), never an exam, a verifier or the evaluator that judges it.
    - It is judged on a fresh sealed slice it could not influence, by the rate or quality of verified gains, never by self-reported scores.
    - Every meta-change records which method produced it, and a weekly review ranks improvement methods by the real gains they produced.
  - id: G3
    title: She improves the improver (gate)
    tier: T1
    pillar: milestone
    branch: human/gates
    owner: human
    protected: false
    size: S
    depends_on:
    - MI1
    - G2
    goal: The first evidence of second-order improvement.
    acceptance:
    - A meta-change raises the rate or quality of independently verified gains on a fresh sealed slice.
    - The result beats noise and replicates with a different seed.
  - id: X1
    title: Self-extensible compiler
    tier: T4
    pillar: meta
    branch: agent/meta
    owner: swarm
    protected: false
    size: M
    depends_on:
    - L1
    - L2
    - L3
    - L4
    - L5
    - L6
    - E2
    goal: The compiler's registry of artifact types and passes becomes something she can add to, through the landing law.
    files:
    - tanishi/compiler/registry.py
    - tests/compiler/test_registry.py
    acceptance:
    - A registry entry declares its schema, emitting pass, landing place, check and gain measure.
    - A new entry is trialled with a pre-registered criterion and joins only if it beats the same experiences compiled without it on the Sealed Vault, per unit of compute.
    - No entry can remove the landing law or the Sealed Vault check.
  - id: R3
    title: Simulation, counterfactual replay
    tier: T3
    pillar: research
    branch: agent/research
    owner: swarm
    protected: false
    size: M
    depends_on:
    - CS2
    - AR1
    goal: Recorded tasks are replayed against a candidate version, to try a change on the past before reality.
    files:
    - tanishi/research/replay.py
    - tests/research/test_replay.py
    acceptance:
    - A recorded task replays deterministically against a candidate version, with tool results taken from the record.
    - Replay predictions are checked against live runs, and their accuracy is the simulator's own score.
  - id: WM1
    title: World model across eight domains
    tier: T3
    pillar: research
    branch: agent/research
    owner: swarm
    protected: false
    size: M
    depends_on:
    - CS5
    - R3
    goal: The prediction ledger extended to eight domains, each with a baseline, so the world model is measured against reality.
    files:
    - tanishi/world/model.py
    - tests/world/test_model.py
    acceptance:
    - Predictions in eight named domains are written before outcomes and resolved later.
    - Each domain has a simple baseline, and the world model's score is reported against it.
  - id: PI1
    title: The Twin
    tier: T1
    pillar: personal
    branch: agent/personal
    owner: swarm
    protected: false
    size: M
    depends_on:
    - CS3
    - CS4
    - SUB3
    goal: Her model of you along 14 dimensions, built from your chats, calendar and GitHub, kept local and private.
    files:
    - tanishi/personal/twin.py
    - tests/personal/test_twin.py
    acceptance:
    - Every Twin fact carries its source and confidence, and you can see and delete any of it.
    - Personal steps are routed to local models only.
    - Her predictions about you are logged and scored like any other.
  - id: IM1
    title: Intrinsic Motivation
    tier: T2
    pillar: personal
    branch: agent/personal
    owner: swarm
    protected: false
    size: M
    depends_on:
    - E3
    - OBS2
    goal: A care score per candidate learning target, from seven signals, so she chooses what is worth learning next.
    files:
    - tanishi/motivation/care.py
    - tests/motivation/test_care.py
    acceptance:
    - Each candidate gets a care score from seven named signals, with your goals ranked first.
    - The score is a prediction of value and is scored against the gain that followed.
    - Her own goals always rank under yours.
  - id: X5
    title: Inference Forge
    tier: T4
    pillar: foundry
    branch: agent/foundry
    owner: swarm
    protected: false
    size: M
    depends_on:
    - SUB3
    goal: An effort brain that picks the model, the number of samples and the search depth per task type.
    files:
    - tanishi/foundry/inference.py
    - tests/foundry/test_inference.py
    acceptance:
    - Each task type gets an effort policy, and every policy is compared on cost and success in the Arena.
    - The router reads the winning policy.
  - id: X7
    title: Data Forge
    tier: T4
    pillar: foundry
    branch: agent/foundry
    owner: swarm
    protected: false
    size: M
    depends_on:
    - L4
    - OBS1
    goal: Her traces and your corrections, curated into training sets with the privacy gate applied.
    files:
    - tanishi/foundry/data.py
    - tests/foundry/test_data.py
    acceptance:
    - Datasets are versioned, deduplicated and scrubbed of personal data and secrets.
    - A dataset is kept only if training on it improves a held-out set.
  - id: X4
    title: Training Forge
    tier: T4
    pillar: foundry
    branch: agent/foundry
    owner: swarm
    protected: false
    size: M
    depends_on:
    - L4
    - L5
    - X7
    goal: LoRA fine-tunes of small local models with MLX on the MacBook, overnight.
    files:
    - tanishi/foundry/train.py
    - tests/foundry/test_train.py
    acceptance:
    - A LoRA run on a small model (up to about 3B, 4-bit) completes inside a memory and time budget on 16 GB.
    - A trained adapter is kept only if it beats its parent in the Arena and passes the Continuity Test.
  - id: X8
    title: Post-training
    tier: T4
    pillar: foundry
    branch: agent/foundry
    owner: swarm
    protected: false
    size: M
    depends_on:
    - X4
    - L4
    goal: Preference pairs from your corrections and tool traces, shaped into the weights.
    files:
    - tanishi/foundry/post_train.py
    - tests/foundry/test_post_train.py
    acceptance:
    - Preference tuning runs on L4's pairs with MLX and is judged on held-out pairs and the Arena.
    - Personal post-training stays on the device.
  - id: X6
    title: Model Forge
    tier: T4
    pillar: foundry
    branch: agent/foundry
    owner: swarm
    protected: false
    size: M
    depends_on:
    - X4
    goal: 'Manages her models as replaceable parts: trained adapters are registered, compared and promoted.'
    files:
    - tanishi/foundry/models.py
    - tests/foundry/test_models.py
    acceptance:
    - Every model or adapter has a lineage record and Arena scores.
    - Promotion needs an Arena win over the parent and a passed Continuity Test.
  - id: X3
    title: Architecture Forge
    tier: T4
    pillar: foundry
    branch: agent/foundry
    owner: swarm
    protected: false
    size: M
    depends_on:
    - E1
    goal: 'Search over agent topology: memory, planner and routing variants as candidates in the archive.'
    files:
    - tanishi/foundry/architecture.py
    - tests/foundry/test_architecture.py
    acceptance:
    - Topology variants are genomes in the evolution archive, judged by the same evaluator.
    - Structural hypotheses from the compiler's pass 8 become candidates here.
  - id: X2
    title: Joint Intelligence Search
    tier: T4
    pillar: foundry
    branch: agent/foundry
    owner: swarm
    protected: false
    size: M
    depends_on:
    - E1
    - X3
    - X4
    goal: One search over data mix, tiny-model architecture, optimizer and sampling with MLX, judged as one candidate.
    files:
    - tanishi/foundry/joint.py
    - tests/foundry/test_joint.py
    acceptance:
    - A candidate is one point in the joint space, trained and judged end to end inside a budget.
    - Results are attributed per coordinate with ablation.
  - id: X9
    title: Hardware Forge
    tier: T4
    pillar: foundry
    branch: agent/foundry
    owner: swarm
    protected: false
    size: M
    depends_on:
    - X5
    goal: Kernel optimization with verified speed-ups on Apple silicon.
    files:
    - tanishi/foundry/kernels.py
    - tests/foundry/test_kernels.py
    acceptance:
    - A candidate kernel must match the reference output within tolerance on random inputs before it is timed.
    - A speed-up counts only if it beats noise over seeded repeats on the target machine.
  - id: DN1
    title: Distributed Intelligence Network v0
    tier: T4
    pillar: network
    branch: agent/network
    owner: swarm
    protected: false
    size: M
    depends_on:
    - CS6
    - L3
    goal: Two Tanishi instances share a discovery as a gene through the privacy gate, and no personal memory ever crosses.
    files:
    - tanishi/network/genes.py
    - tests/network/test_genes.py
    acceptance:
    - A gene is a skill or strategy with its evidence and no personal data.
    - The privacy gate scrubs, then runs a reconstruction test; a gene that leaks anything about a person is refused.
    - The receiving instance runs the gene through its own Arena before using it.
  - id: G4
    title: A discovery that travels (gate)
    tier: T1
    pillar: milestone
    branch: human/gates
    owner: human
    protected: false
    size: S
    depends_on:
    - E4
    - E6
    - RE1
    - G2
    goal: The first sign of the Expansion.
    acceptance:
    - A capability or strategy no human authored is found by Unknown Discovery, verified and retained.
    - It raises results in a second, different task cluster by more than noise, and Causal Attribution assigns the gain to it.
