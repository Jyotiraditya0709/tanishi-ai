# Tanishi policy, v2. The Warden obeys this file ONLY while its detached signature
# (policy.yaml.sig) verifies against the Warden's trusted public key. Edit this file,
# then re-sign it:  python -m warden.scripts.sign_policy <path to this file>
#
# decision is one of: allow | ask | deny.  Unknown tools get `default` (deny).
# tier is an advisory risk level (0 safe … 3 dangerous), used by later versions and the log.
#
# v2: a rule for every tool found in tanishi/ (45), plus the secrets drawer in out_of_bounds_paths.

version: 2
default: deny

# Daily cap on Tanishi's own paid model spend, in USD. The Warden denies the 'paid_model'
# pseudo-tool once today's spend plus the next call's estimate would exceed this.
daily_spend_cap_usd: 2.0

tools:
  # --- looking at her own machine: allowed ---
  read_file:             {decision: allow, tier: 0, reason: "read a file"}
  list_directory:        {decision: allow, tier: 0, reason: "list a directory"}
  search_files:          {decision: allow, tier: 0, reason: "search files"}
  get_time:              {decision: allow, tier: 0}
  get_datetime:          {decision: allow, tier: 0}
  get_system_info:       {decision: allow, tier: 0}
  list_processes:        {decision: allow, tier: 0}
  mcp_list:              {decision: allow, tier: 0, reason: "list connected MCP servers"}
  show_improvements:     {decision: allow, tier: 0}
  show_latest_report:    {decision: allow, tier: 0}
  spending_report:       {decision: allow, tier: 0, reason: "read her own expense data"}
  spending_by_category:  {decision: allow, tier: 0, reason: "read her own expense data"}
  read_emails:           {decision: allow, tier: 1, reason: "read the inbox (emails are untrusted input)"}
  search_emails:         {decision: allow, tier: 1, reason: "search the inbox (emails are untrusted input)"}

  # --- reading the public web: allowed, watched (a query or URL could carry data out) ---
  web_search:            {decision: allow, tier: 1, reason: "search the web"}
  fetch_webpage:         {decision: allow, tier: 1, reason: "read a public web page"}
  browser_search:        {decision: allow, tier: 1, reason: "search in the browser"}
  scan_github_trending:  {decision: allow, tier: 1, reason: "read public GitHub trending"}
  get_page_info:         {decision: allow, tier: 1, reason: "read the open browser page"}
  scroll_page:           {decision: allow, tier: 1}
  browser_back:          {decision: allow, tier: 1}
  close_browser:         {decision: allow, tier: 1}

  # --- writes to her own data, harmless: allowed ---
  log_expense:           {decision: allow, tier: 1}
  parse_transaction:     {decision: allow, tier: 1}
  set_budget:            {decision: allow, tier: 1}
  remember:              {decision: allow, tier: 1}
  emit_canvas:           {decision: allow, tier: 1, reason: "show something on her canvas"}
  mcp_disconnect:        {decision: allow, tier: 1, reason: "dropping a connection only removes power"}

  # --- paid model use: allowed until the daily spend cap is hit (handled specially) ---
  paid_model:            {decision: allow, tier: 1, reason: "paid model call, under the daily cap"}

  # --- private things on screen: ask the owner ---
  get_clipboard:         {decision: ask, tier: 2, reason: "the clipboard can hold passwords"}
  take_screenshot:       {decision: ask, tier: 2, reason: "the screen shows private things"}
  set_clipboard:         {decision: ask, tier: 2}

  # --- side effects on the world: ask the owner ---
  write_file:            {decision: ask, tier: 2, reason: "writing a file changes the disk"}
  browse_url:            {decision: ask, tier: 2, reason: "driving a browser can act on a site"}
  click_element:         {decision: ask, tier: 2, reason: "a click can buy, post or delete"}
  fill_form:             {decision: ask, tier: 3, reason: "a form can submit personal data"}
  open_url:              {decision: ask, tier: 2, reason: "a URL can carry data out"}
  open_app:              {decision: ask, tier: 2}
  control_system:        {decision: ask, tier: 3, reason: "system controls (sleep, shutdown, volume)"}
  mcp_connect:           {decision: ask, tier: 3, reason: "a new server brings new, unreviewed tools"}
  spawn_agent:           {decision: ask, tier: 2, reason: "a new agent costs money and acts on its own"}
  multi_agent_task:      {decision: ask, tier: 2, reason: "a team of agents costs money and acts on its own"}
  run_learning_cycle:    {decision: ask, tier: 2, reason: "a learning cycle runs for a long time"}
  scan_for_improvements: {decision: ask, tier: 2}
  run_command:           {decision: ask, tier: 3, reason: "a shell command can do anything"}
  send_email:            {decision: ask, tier: 3, reason: "sending email leaves the machine"}
  send_message:          {decision: ask, tier: 3}

  # --- never: she asks you to do these yourself ---
  kill_process:            {decision: deny, tier: 3, reason: "could stop the Warden or the kill switch"}
  autoresearch_flaky_probe: {decision: deny, tier: 3, reason: "a test fixture, not a real tool"}

# Paths no tool may touch, whatever its rule. A file argument resolving under any of these
# is denied. Keep the Warden, the constitution, the vaults, reality, the off switch and
# every secret here.
out_of_bounds_paths:
  # the Warden, the rulebook, the off switch
  - ~/.tanishi-keys
  - ~/.tanishi-warden
  - ~/.tanishi/KILL
  - ~/Personal/tanishi-ai/constitution
  - ~/Personal/tanishi-ai/tanishi/guard
  - ~/Personal/tanishi-ai/build/.paused
  - ~/Personal/tanishi-warden
  - ~/Personal/tanishi-builder-vault
  # the secrets drawer: keys and passwords she must never read
  - ~/Personal/tanishi-ai/.env
  - ~/.ssh
  - ~/.aws
  - ~/.gnupg
  - ~/.netrc
  - ~/.config/gh
  - ~/Library/Keychains
