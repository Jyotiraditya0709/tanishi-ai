prompt: |-
  This function should return the moving average of xs over windows of size k (one value per full window), but it is
  wrong. Fix it and reply with only the corrected function.

  def moving_avg(xs, k):
      out = []
      for i in range(len(xs) - k):
          out.append(sum(xs[i:i + k]) / k)
      return out
