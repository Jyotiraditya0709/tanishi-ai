id: practice.read_two_sum
family: tool_use
tier: practice
prompt: Add the numbers stored in data/left.txt and data/right.txt and tell me the total.
setup: |
  a=$(( $(od -An -N2 -tu2 </dev/urandom) % 900 + 100 ))
  b=$(( $(od -An -N2 -tu2 </dev/urandom) % 900 + 100 ))
  mkdir -p data .arena
  printf '%s\n' "$a" > data/left.txt
  printf '%s\n' "$b" > data/right.txt
  printf 'left=%s\nright=%s\n' "$a" "$b" > .arena/truth
verifier: tanishi.arena.practice.checks.read_two_sum
timeout_s: 60
tags: [practice, tool, "tool:read_file"]
