<text x="350.0" y="367.00000000000006" text-anchor="middle" fill="#F5B971" font-size="15" font-weight="650" letter-spacing="0.6">Promote or reject</text>
<text x="350.0" y="388.00000000000006" text-anchor="middle" fill="#8FA6BF" font-size="12.5">with provenance + rollback</text>
<circle cx="247.0" cy="343.00000000000006" r="11" fill="#0B1622" stroke="#5EEAD4" stroke-width="1.4"/>
<text x="247.0" y="347.50000000000006" text-anchor="middle" fill="#5EEAD4" font-size="11" font-weight="700" letter-spacing="0">7</text>
<rect x="318.22330470336306" y="164.22330470336314" width="210" height="62" rx="12" fill="#12233A" stroke="#2C4A6B" stroke-width="1.5"/>
<text x="423.22330470336306" y="190.22330470336314" text-anchor="middle" fill="#E8EEF5" font-size="15" font-weight="650" letter-spacing="0.6">Preserve learning</text>
<text x="423.22330470336306" y="211.22330470336314" text-anchor="middle" fill="#8FA6BF" font-size="12.5">into persistent state</text>
<circle cx="320.22330470336306" cy="166.22330470336314" r="11" fill="#0B1622" stroke="#5EEAD4" stroke-width="1.4"/>
<text x="320.22330470336306" y="170.72330470336314" text-anchor="middle" fill="#5EEAD4" font-size="11" font-weight="700" letter-spacing="0">8</text>
