<rect x="318.22330470336317" y="517.776695296637" width="210" height="62" rx="12" fill="#12233A" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="423.22330470336317" y="543.776695296637" text-anchor="middle" fill="#A5B4FC" font-size="15" font-weight="650" letter-spacing="0.6">Evaluate independently</text>
<text x="423.22330470336317" y="564.776695296637" text-anchor="middle" fill="#8FA6BF" font-size="12.5">practice + held-out</text>
